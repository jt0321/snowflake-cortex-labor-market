[project]
name = "snowflake-cortex-labor-market"
version = "0.1.0"
description = "AI & the Labor Market — Snowflake Cortex AI data platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "requests>=2.32",
    "snowflake-connector-python>=3.12",
    # dbt
    "dbt-snowflake>=1.8",
    # dagster
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "dagster-dbt>=0.25",
    "dagster-snowflake>=0.25",
    "dagster-snowflake-pandas>=0.25",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.dagster]
module_name = "dagster_project.definitions"
