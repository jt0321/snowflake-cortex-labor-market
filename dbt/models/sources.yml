version: 2

sources:
  - name: raw
    database: LABOR_MARKET
    schema: RAW
    tables:
      - name: RAW_NEWS_HEADLINES
        description: News headlines — AI, labor market, IPO topics. NewsAPI (fresh, ~1 month depth) plus GDELT and Hacker News (keyless, backfilled to 2020)
        columns:
          - name: article_id
            tests: [not_null, unique]
      - name: RAW_STOCK_PRICES
        description: Daily closing prices for MSFT, GOOGL, AMZN, TSLA, QQQ, and ^GSPC (S&P 500)
        columns:
          - name: ticker
            tests: [not_null]
          - name: observation_date
            tests: [not_null]
      - name: RAW_LAYOFFS_FYI
        description: Tech layoffs from Layoffs.fyi (Airtable scrape)
        columns:
          - name: layoff_id
            tests: [not_null, unique]
      - name: RAW_BLS_JOLTS
        description: BLS JOLTS monthly layoffs by industry
        columns:
          - name: series_id
            tests: [not_null]
          - name: year
            tests: [not_null]
          - name: period
            tests: [not_null]
      - name: RAW_BLS_CPS
        description: BLS CPS unemployment + labor force participation
        columns:
          - name: series_id
            tests: [not_null]
          - name: year
            tests: [not_null]
          - name: period
            tests: [not_null]
      - name: RAW_FRED_SERIES
        description: FRED series — UNRATE, PAYEMS, ICSA, CPIAUCSL, CPILFESL, FEDFUNDS
        columns:
          - name: series_id
            tests: [not_null]
          - name: observation_date
            tests: [not_null]
      - name: RAW_POLYMARKET_MARKETS
        description: Daily snapshots of Polymarket implied probabilities for recession/unemployment/AI-jobs/IPO markets
        columns:
          - name: market_id
            tests: [not_null]
          - name: snapshot_date
            tests: [not_null]
